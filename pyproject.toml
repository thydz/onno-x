[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onno-x"
version = "0.1.0"
description = "Multi-model coding agent CLI supporting local models (Ollama, vLLM, LM Studio) and remote APIs (Anthropic, OpenAI, etc.)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "textual>=0.50.0",
    "openai>=1.0.0",
]

[project.scripts]
onno-x = "onno_x.main:app"
